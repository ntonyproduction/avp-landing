<!doctype html>
<meta charset="utf-8">
<title>AVP Facebook cover</title>
<!-- The Facebook Page cover (2026-11-13): the YouTube banner (banner.html) recut to Facebook's 1640x624.
     Desktop shows the whole image; phones show only the 1110x624 centre, so everything sits in that box.
     Same tiles as the YouTube banner: update both at each launch. Facebook has no "link below", so the
     line under the headline names the site. Render: see the command at the end of this file. -->
<style>
  @font-face{font-family:"IBM Plex Mono";font-weight:600;src:url(fonts/ibmplexmono-600.woff2) format("woff2")}
  @font-face{font-family:"Montserrat";font-weight:100 900;src:url(fonts/montserrat-900.woff2) format("woff2")}
  :root{--ground:#0A0E12; --edge:#24303A; --brand:#62A3DA; --ink:#EAEDF0; --ink-dim:#9DA9B4}
  html,body{margin:0; width:1640px; height:624px; overflow:hidden; background:var(--ground)}
  body{position:relative; color:var(--ink); font-family:Montserrat,sans-serif; -webkit-font-smoothing:antialiased}
  .glow{position:absolute; inset:0;
    background:
      radial-gradient(520px 260px at 1010px 300px, rgba(98,163,218,.14), transparent 72%),
      radial-gradient(720px 340px at 560px 300px, rgba(98,163,218,.07), transparent 70%)}
  .grid{position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(52,68,82,.42) 2px, transparent 2px),
      linear-gradient(90deg, rgba(52,68,82,.42) 2px, transparent 2px);
    background-size:64px 64px; background-position:12px 20px;
    -webkit-mask-image:linear-gradient(90deg, #000 0, rgba(0,0,0,.55) 12%, transparent 30%, transparent 70%, rgba(0,0,0,.55) 88%, #000 100%);
            mask-image:linear-gradient(90deg, #000 0, rgba(0,0,0,.55) 12%, transparent 30%, transparent 70%, rgba(0,0,0,.55) 88%, #000 100%)}
  /* phone-safe centre: 1110 wide, nudged up a little so nothing sits under the Page's buttons */
  /* zoomed in (Anthony, 2026-11-13): the content fills the phone-safe centre instead of floating in it */
  .safe{position:absolute; left:215px; top:0; width:1210px; height:604px;
    display:grid; grid-template-columns:1fr auto; column-gap:44px; align-items:center;
    padding:0 10px 0 20px; box-sizing:border-box}
  h1{margin:0; font-weight:900; font-size:94px; line-height:.95; letter-spacing:-.028em}
  h1 em{font-style:normal; color:var(--brand)}
  .cta{margin:24px 0 0; font-weight:800; font-size:38px; letter-spacing:-.012em; color:var(--ink)}
  .site{margin:8px 0 0; font-weight:700; font-size:27px; color:var(--ink-dim)}
  .renders{display:grid; grid-template-columns:340px 164px 164px; grid-template-rows:164px 164px; gap:12px}
  .render{margin:0; border:2px solid var(--edge); border-radius:6px; overflow:hidden; box-shadow:0 24px 64px rgba(0,0,0,.55)}
  .render.big{grid-row:1 / span 2}
  .render img{display:block; width:100%; height:100%}
  .new{position:relative}
  .new::before{content:"New"; position:absolute; top:16px; left:16px; z-index:1;
    font-family:"IBM Plex Mono",monospace; font-size:26px; font-weight:600; letter-spacing:.16em;
    text-transform:uppercase; line-height:1; background:var(--brand); color:var(--ground);
    border-radius:4px; padding:10px 14px 8px; box-shadow:0 4px 18px rgba(0,0,0,.5)}
</style>

<div class="glow"></div>
<div class="grid"></div>

<div class="safe">
  <div>
    <h1><em>Tools</em><br>for video<br>editors.</h1>
    <p class="cta">Most of them free.</p>
    <p class="site">audiovisionproductions.ca</p>
  </div>
  <div class="renders">
    <figure class="render big new"><img src="../velvox.jpg" alt=""></figure>
    <figure class="render"><img src="../tellybox.jpg" alt=""></figure>
    <figure class="render"><img src="../textback.jpg" alt=""></figure>
    <figure class="render"><img src="../flipbook.jpg" alt=""></figure>
    <figure class="render"><img src="../paperboy.jpg" alt=""></figure>
  </div>
</div>
<!-- render (PowerShell, in this folder):
  & "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless=new --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=1640,624 --virtual-time-budget=5000 --allow-file-access-from-files --screenshot="$PWD\facebook-cover.png" "file:///$($PWD -replace '\\','/')/facebook-cover.html"
-->
